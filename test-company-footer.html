<!DOCTYPE html>\n<html>\n<head>\n    <title>Test Company Footer API</title>\n</head>\n<body>\n    <h1>Testing Company Profile API</h1>\n    <button onclick=\"testAPI()\">Test API</button>\n    <div id=\"result\"></div>\n\n    <script>\n        async function testAPI() {\n            const resultDiv = document.getElementById('result');\n            resultDiv.innerHTML = 'Testing...';\n            \n            try {\n                console.log('🔍 Testing company API...');\n                \n                // Try different possible endpoints\n                const endpoints = [\n                    '/api/tb_company',\n                    '/api/company_profile_management', \n                    '/api/company'\n                ];\n                \n                for (const endpoint of endpoints) {\n                    console.log(`📡 Testing endpoint: ${endpoint}`);\n                    try {\n                        const response = await fetch(endpoint);\n                        console.log(`Response status for ${endpoint}:`, response.status);\n                        \n                        if (response.ok) {\n                            const data = await response.json();\n                            console.log(`✅ Data from ${endpoint}:`, data);\n                            resultDiv.innerHTML = `<h3>✅ Success with ${endpoint}</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;\n                            return;\n                        } else {\n                            console.log(`❌ Error from ${endpoint}:`, response.status);\n                        }\n                    } catch (error) {\n                        console.log(`💥 Error with ${endpoint}:`, error.message);\n                    }\n                }\n                \n                resultDiv.innerHTML = '<h3>❌ All endpoints failed</h3>';\n                \n            } catch (error) {\n                console.error('💥 Test failed:', error);\n                resultDiv.innerHTML = `<h3>💥 Error: ${error.message}</h3>`;\n            }\n        }\n    </script>\n</body>\n</html>
