<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection Route Performance Debugger</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            margin: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .panel {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 15px;
            margin: 10px 0;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            padding: 5px;
            border-bottom: 1px solid #444;
        }
        .metric-value {
            font-weight: bold;
        }
        .warning {
            color: #ff9900;
        }
        .error {
            color: #ff4444;
        }
        .success {
            color: #44ff44;
        }
        .log-entry {
            font-size: 12px;
            margin: 2px 0;
            padding: 2px;
            border-left: 3px solid #444;
            padding-left: 10px;
        }
        .timestamp {
            color: #888;
        }
        button {
            background: #007acc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #005a9e;
        }
        .section-title {
            color: #66ccff;
            border-bottom: 1px solid #66ccff;
            padding-bottom: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Collection Route Performance Debugger</h1>
        
        <div class="panel">
            <h2>Controls</h2>
            <button onclick="startMonitoring()">Start Monitoring</button>
            <button onclick="stopMonitoring()">Stop Monitoring</button>
            <button onclick="clearLogs()">Clear Logs</button>
            <button onclick="testTranslation()">Test Translation API</button>
            <button onclick="navigateToCollection()">Navigate to /collections</button>
        </div>

        <div class="panel">
            <h2>Performance Metrics</h2>
            <div class="metric">
                <span>Translation Calls:</span>
                <span id="translationCalls" class="metric-value">0</span>
            </div>
            <div class="metric">
                <span>API Calls:</span>
                <span id="apiCalls" class="metric-value">0</span>
            </div>
            <div class="metric">
                <span>Memory Usage:</span>
                <span id="memoryUsage" class="metric-value">-</span>
            </div>
            <div class="metric">
                <span>Page Load Time:</span>
                <span id="pageLoadTime" class="metric-value">-</span>
            </div>
            <div class="metric">
                <span>Translation Time:</span>
                <span id="translationTime" class="metric-value">-</span>
            </div>
        </div>

        <div class="panel">
            <h2>Real-time Logs</h2>
            <div id="logs" style="max-height: 400px; overflow-y: auto; background: #1a1a1a; padding: 10px; border-radius: 5px;">
                <div class="log-entry">Ready to monitor collection route performance...</div>
            </div>
        </div>

        <div class="panel">
            <h2>Performance Analysis</h2>
            <div id="analysis"></div>
        </div>
    </div>

    <script>
        let monitoringInterval;
        let translationCallCount = 0;
        let apiCallCount = 0;
        let startTime;
        let translationStartTime;

        function log(message, type = 'info') {
            const logs = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;
            
            if (type === 'error') logEntry.style.color = '#ff4444';
            if (type === 'warning') logEntry.style.color = '#ff9900';
            if (type === 'success') logEntry.style.color = '#44ff44';
            
            logs.appendChild(logEntry);
            logs.scrollTop = logs.scrollHeight;
        }

        function updateMetrics() {
            document.getElementById('translationCalls').textContent = translationCallCount;
            document.getElementById('apiCalls').textContent = apiCallCount;
            
            if (performance.memory) {
                const memory = performance.memory;
                document.getElementById('memoryUsage').textContent = 
                    `Used: ${(memory.usedJSHeapSize / 1024 / 1024).toFixed(2)}MB / Total: ${(memory.totalJSHeapSize / 1024 / 1024).toFixed(2)}MB`;
            }
        }

        function startMonitoring() {
            log('Starting performance monitoring...', 'success');
            startTime = performance.now();
            
            // Patch fetch to monitor API calls
            const originalFetch = window.fetch;
            window.fetch = function(...args) {
                if (args[0] && args[0].includes('translate')) {
                    apiCallCount++;
                    log(`API Call #${apiCallCount}: ${args[0]}`, 'warning');
                    updateMetrics();
                }
                return originalFetch.apply(this, args);
            };

            // Monitor translation service calls
            const originalTranslate = window.optimizedTranslationService?.translateText;
            if (originalTranslate) {
                window.optimizedTranslationService.translateText = function(...args) {
                    translationCallCount++;
                    translationStartTime = performance.now();
                    log(`Translation Call #${translationCallCount}: ${JSON.stringify(args[0])}`, 'warning');
                    updateMetrics();
                    
                    const result = originalTranslate.apply(this, args);
                    result.then(() => {
                        const translationTime = performance.now() - translationStartTime;
                        document.getElementById('translationTime').textContent = `${translationTime.toFixed(2)}ms`;
                        log(`Translation completed in ${translationTime.toFixed(2)}ms`, 'success');
                    });
                    return result;
                };
            }

            monitoringInterval = setInterval(() => {
                updateMetrics();
                const currentTime = performance.now();
                const elapsed = currentTime - startTime;
                document.getElementById('pageLoadTime').textContent = `${elapsed.toFixed(2)}ms`;
                
                // Performance analysis
                let analysis = '';
                if (translationCallCount > 50) {
                    analysis += '<div class="error">❌ HIGH: Too many translation calls detected</div>';
                }
                if (apiCallCount > 10) {
                    analysis += '<div class="error">❌ HIGH: Too many API calls detected</div>';
                }
                if (translationCallCount === 0 && apiCallCount === 0) {
                    analysis += '<div class="warning">⚠️ No translation/API activity detected</div>';
                }
                if (elapsed > 5000) {
                    analysis += '<div class="warning">⚠️ Page load taking longer than 5 seconds</div>';
                }
                
                document.getElementById('analysis').innerHTML = analysis || '<div class="success">✅ Performance looks good</div>';
            }, 1000);
        }

        function stopMonitoring() {
            if (monitoringInterval) {
                clearInterval(monitoringInterval);
                log('Monitoring stopped', 'info');
            }
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
            log('Logs cleared', 'info');
        }

        function testTranslation() {
            log('Testing translation API...', 'info');
            fetch('http://localhost:5000/translate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    q: 'Halo dunia',
                    source: 'id',
                    target: 'en',
                    format: 'text'
                })
            })
            .then(response => response.json())
            .then(data => {
                log(`Translation test successful: "${data.translatedText}"`, 'success');
            })
            .catch(error => {
                log(`Translation test failed: ${error.message}`, 'error');
            });
        }

        function navigateToCollection() {
            log('Navigating to /collections route...', 'info');
            window.location.href = '/collections';
        }

        // Auto-start monitoring when page loads
        window.addEventListener('load', () => {
            log('Performance debugger loaded', 'success');
            startMonitoring();
        });
    </script>
</body>
</html>
